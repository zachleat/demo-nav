name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Actions are pinned to commit SHAs, not tags: a tag can be moved to point at
# different code, a SHA cannot. The trailing comment is the version it was.

# Everything the deploy needs, and nothing else.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      # lightningcss minifies demo-nav.css and build.js inlines the result
      # into both outputs. Nothing generated is read from the repo.
      - run: npm ci
      - run: npm run build

      - name: Collect the site
        run: |
          mkdir -p _site
          cp index.html demo-nav.html demo-nav.css _site/

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
